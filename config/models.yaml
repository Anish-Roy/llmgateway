# Model registry. Clients send an alias as `model`; the gateway picks the provider and model.
#
# providers: named provider instances. `type` picks the adapter; the other keys are its options.
#            A provider whose API key isn't set is skipped at startup, with a warning.
# aliases:   alias -> ordered list of "provider/model". The first entry serves the request;
#            later entries are fallbacks, tried on timeouts, 429s and 5xx errors (not on a 400).
#            The text after the first "/" is the provider's own model name, so it may contain
#            more slashes.
# pricing:   "provider/model" -> list price per 1M tokens. See the section at the end.

# Model IDs checked on 2026-10-25 against each provider's model list, using our keys.
# Providers retire models and change free-tier access often: recheck with
#   uv run python -m scripts.check_models

providers:
  # gpt-oss models reason before answering, and that counts against max_tokens. At "low" a
  # short answer fits in a small max_tokens; the reasoning text is left out of the reply.
  groq:
    type: groq
    reasoning_effort: low
    include_reasoning: false
  gemini:
    type: gemini
  mock:
    type: mock
  # Always fails with a 503: put it first in an alias to watch fallback happen.
  flaky:
    type: mock
    failure_rate: 1.0
  # Streams a few words, then fails (a 503). Shows that a stream can't fall back once the
  # client has part of an answer. Non-streamed requests answer normally.
  midstream:
    type: mock
    reply: "This answer will be cut off partway through."
    chunk_latency_s: 0.2
    fail_after_chunks: 4

aliases:
  # Cheap and quick. Flash-Lite thinks at "minimal" by default, so max_tokens stays for the answer.
  fast:
    - groq/openai/gpt-oss-20b
    - gemini/gemini-3.5-flash-lite
  # Better answers, slower and pricier. Groq goes first: on 2026-10-25 gemini-3.8-flash timed
  # out on 5 of 6 calls and answered the other with a 503 "high demand", so as the first
  # choice it cost every request a 30 s wait. Swap back once it answers reliably.
  # Gemini 3.8 Flash thinks at "medium" by default.
  strong:
    - groq/openai/gpt-oss-120b
    - gemini/gemini-3.8-flash
  mock:
    - mock/mock-model
  # Fallback demo with no keys: flaky fails (and is retried once), mock answers.
  # Check the x-gateway-provider / x-gateway-attempts / x-gateway-fallback headers.
  demo-fallback:
    - flaky/mock-model
    - mock/mock-model
  # Mid-stream failure demo (stream=True): the client gets "This answer will", then an error
  # event. mock is listed but never asked, because fallback stops at the first token.
  demo-midstream:
    - midstream/mock-model
    - mock/mock-model

# model: "auto" sends each request to `cheap` or `strong` (app/routing/auto.py). The first rule
# that matches picks `strong`, in this order; a request no rule matches goes to `cheap`. All but
# the first two read only the last user message. The x-gateway-route header and request_logs
# say which alias was picked and why. Measured with `uv run python -m scripts.eval_router`:
# see docs/decisions.md.
auto:
  cheap: fast
  strong: strong
  long_answer_max_tokens: 2048
  long_conversation_turns: 5
  # A ``` fence counts whatever its length.
  pasted_lines: 3
  long_prompt_tokens: 20
  keywords:
    - implement
    - write
    - draft
    - rewrite
    - design
    - prove
    - derive
    - step by step
    - explain
    - in detail
    - analyze
    - analyse
    - compare
    - trade-offs
    - pros and cons
    - justify
    - argue
    - debug
    - fix
    - refactor
    - optimize
    - solve
    - calculate
    - estimate
    - probability
    - summarize
    - summarise
    - translate the following

# List price in USD per 1M tokens, for every provider/model an alias uses (the gateway won't
# start if one is missing). Mock targets are free unless listed. Free-tier calls are logged at
# list price too, so the costs mean something. Output includes reasoning and thinking tokens.
# Each call's cost is saved when it's logged, so changing a price here doesn't rewrite history.
#
# Checked on 2026-10-25: console.groq.com/docs/models, ai.google.dev/gemini-api/docs/pricing
# (paid tier, text). gemini-3.8-flash goes up to 1.50 / 7.50 on 2027-01-01: update it then.
pricing:
  groq/openai/gpt-oss-20b:
    input: 0.075
    output: 0.30
  groq/openai/gpt-oss-120b:
    input: 0.15
    output: 0.60
  gemini/gemini-3.5-flash-lite:
    input: 0.30
    output: 2.50
  gemini/gemini-3.8-flash:
    input: 0.75
    output: 3.75
